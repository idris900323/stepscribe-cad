name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:  # the full matrix, macOS included, on demand: run it on release/v2 before a release

# A new push or a reopened pull request replaces the run that is still going for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce and slow, so a pull request runs Linux and Windows; macOS runs
        # on every push to main and build/** and on demand (workflow_dispatch), before a release.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Virtual display for the image renderer (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - run: python -m pip install -e ".[dev,mcp,llm]"
      - name: Dependency audit (a warning for now; make it blocking once it is clean)
        run: pip-audit --skip-editable
        continue-on-error: true
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy stepscribe
      - run: python scripts/sync_skills.py --check
      - run: python scripts/check_release.py
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pytest -q -p no:cacheprovider --junitxml=junit.xml
      - name: No test may be skipped unexpectedly (the POSIX tests must run on Linux and macOS)
        if: always()
        run: python scripts/check_skips.py junit.xml

  # Layer 2 of validate-robot needs the optional extra (MuJoCo). Every test that uses MuJoCo runs
  # here, on every platform and Python of the matrix; STEPSCRIBE_REQUIRE_ROBOT=1 makes a skip a failure.
  # macos-latest is Apple silicon, for which MuJoCo has wheels (there is none for macOS Intel, and no
  # Intel runner label is used here).
  robot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      STEPSCRIBE_REQUIRE_ROBOT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Virtual display for the image renderer (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,robot]"
      - name: Dependency audit with the robot extra installed (a warning for now, like the main audit)
        run: pip-audit --skip-editable
        continue-on-error: true
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pytest -q -p no:cacheprovider --junitxml=junit.xml tests/test_robot_libs.py tests/test_robot_validate.py
      - name: The robot tests must have run, not been skipped
        if: always()
        run: python scripts/check_skips.py junit.xml

  # The unit tests build without isolation (no download from PyPI). This job is the one place the
  # project is built the way a release builds it: in a fresh isolated environment.
  isolated-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build the wheel and sdist in an isolated environment
        run: python -m build --outdir dist
      - name: Build the skill zip and check the release files
        run: |
          python scripts/sync_skills.py
          python scripts/check_release.py --dist dist
